# Хранилище фотографий каталога ИП «ТехноХолод» — img.tehnoholod369.kz
#
# Заведено 26.08.2026 взамен jsDelivr: тот не отдаёт файлы из репозитория крупнее
# 50 МБ («403 Package size exceeded»), а фото каталога — почти 600 МБ. Это уже
# видели покупатели: у первого посетителя редкой карточки вместо снимка стояло
# «Фото уточняется».
#
# Netlify публикует КОРЕНЬ репозитория, поэтому адрес фото сохраняет привычный вид
# img.tehnoholod369.kz/img/<группа>/<файл> — в коде меняется только window.PHOTO_CDN
# в novy-dizayn/photo-base.js, все относительные пути в данных остаются как есть.
#
# Что сюда НЕ переезжает: скрипты идут через jsDelivr (raw отдаёт .js с nosniff,
# и браузер молча их не выполняет), данные — через raw (у jsDelivr кэш @main
# держится до 12 часов, цены и остатки отставали бы).

[build]
  publish = "."
  command = ""

# Имя файла у фотографии не переиспользуется: новый кадр — новое имя.
# Поэтому кэшируем на год и не заставляем браузер перепроверять.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/img-dobor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Страницы каталога и данные с этого адреса не раздаются как витрина — они здесь
# только потому, что лежат в том же репозитории. Поисковикам их отсюда не надо:
# основной адрес витрины один, дубли вредят.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
